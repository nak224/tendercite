services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TENDERCITE_DATA_DIR: /app/data
    volumes:
      - tendercite-data:/app/data

  ui:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir streamlit httpx &&
             streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501"
    ports:
      - "8501:8501"
    environment:
      TENDERCITE_API_URL: http://api:8000
    volumes:
      - ./frontend:/app/frontend:ro
    depends_on:
      - api

volumes:
  tendercite-data:
